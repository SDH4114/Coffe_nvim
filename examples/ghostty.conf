# Optional Ghostty binding: Cmd-Backspace sends F8 (Coffe: delete whole line).
# This affects every app in that terminal. Add manually only if desired.
keybind = super+backspace=text:\x1b[19~
# Keep Ghostty's native Cmd-C / Cmd-V for terminal selection and paste.
# For Neovim visual selection use Space y; undo: u; redo: Ctrl-R.
